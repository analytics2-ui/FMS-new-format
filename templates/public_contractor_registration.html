<script>
function handleToggle(statusId, numberId, fileId) {
  const status = document.getElementById(statusId);
  const number = document.getElementById(numberId);
  const file = document.getElementById(fileId);

  status.addEventListener("change", function () {
    if (this.value === "YES") {
      number.disabled = false;
      file.disabled = false;
      number.required = true;
      file.required = true;
    } else {
      number.disabled = true;
      file.disabled = true;
      number.required = false;
      file.required = false;
      number.value = "";
      file.value = "";
    }
  });
}

handleToggle("pan_status", "pan_no", "attachment3");
handleToggle("gst_status", "gst_no", "attachment1");
handleToggle("msme_status", "msme_no", "attachment2");

document.getElementById("contractorForm").addEventListener("submit", function (e) {
  const fields = ["pan_status", "gst_status", "msme_status"];
  for (let id of fields) {
    if (!document.getElementById(id).value) {
      alert("Please select NA or Provide option for PAN, GST, and MSME");
      e.preventDefault();
      return;
    }
  }
});
</script>


  <script>
  $(function(){
    // init DataTable
    const table = $('#p1Table').DataTable({
      responsive: true,
      order: [[0,'desc']]
    });

    // init Select2
    $('#idFilter, #locationFilter, #statusFilter').select2({
      width:'100%', placeholder:'—'
    });

    // after your other select2 inits…
    $('#budgetHeadSelect').select2({
      placeholder: $('#budgetHeadSelect').data('placeholder'),
      width: '100%',
      dropdownParent: $('#newProposalModal')  // ensure the dropdown stays inside the modal
    });


    // populate filters
    function populateFilter(colIndex, sel){
      let vals = new Set();
      table.column(colIndex).data().each(v => vals.add(v));
      vals.forEach(v => sel.append(new Option(v,v)));
    }
    populateFilter(0, $('#idFilter'));
    populateFilter(2, $('#locationFilter'));
    populateFilter(8, $('#statusFilter'));

    // apply filters
    $('#idFilter').on('change', ()=> table.column(0)
      .search($('#idFilter').val().join('|'), true,false).draw());
    $('#locationFilter').on('change', ()=> table.column(2)
      .search($('#locationFilter').val().join('|'), true,false).draw());
    $('#statusFilter').on('change', ()=> table.column(8)
      .search($('#statusFilter').val().join('|'), true,false).draw());

    // datepickers (DD/MM/YYYY)
    $('#plannedStart, #plannedEnd').datepicker({ dateFormat:'dd/mm/yy' });

    // range‐filter logic
    $.fn.dataTable.ext.search.push((settings, data) => {
      let start = $('#plannedStart').datepicker('getDate'),
          end   = $('#plannedEnd').datepicker('getDate'),
          parts = data[7].split(' ')[0].split('/'),
          date  = new Date(parts[2], parts[1]-1, parts[0]);
      if ((!start && !end) || !date) return true;
      if (start && date < start) return false;
      if (end   && date > end)   return false;
      return true;
    });
    $('#plannedStart, #plannedEnd').on('change', ()=> table.draw());

    // clear all
    $('#clearFilters').on('click', ()=>{
      $('#idFilter,#locationFilter,#statusFilter').val(null).trigger('change');
      $('#plannedStart,#plannedEnd').val('');
      table.search('').columns().search('').draw();
    });
  });
  </script>
</body>
</html>
